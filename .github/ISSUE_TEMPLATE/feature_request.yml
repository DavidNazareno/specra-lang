name: Feature request
description: Suggest an improvement for Specra.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation is causing pain?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Specra to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add examples, repos, or agent workflows if helpful.
